<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Asesores</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #ffffff;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .contenedor {
      max-width: 1200px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 30px;
    }
    h1 {
      color: #6c5ce7;
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
    }
    .controles {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 20px;
    }
    .input-box {
      padding: 12px;
      border-radius: 8px;
      border: 2px solid #dfe6e9;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      outline: none;
      width: 100%;
      max-width: 300px;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      box-shadow: 0 4px 6px rgba(0,0,0,0.04);
      border-radius: 12px;
      overflow: hidden;
    }
    th {
      background: #6c5ce7;
      color: #ffffff;
      padding: 14px;
      text-align: left;
    }
    td {
      padding: 14px;
      border-bottom: 1px solid #f1f2f6;
    }
    tr:hover td { background: #f8f9fa; }
    
    /* Contenedor flexible para el teléfono y el botón de copiar */
    .caja-telefono {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    select {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 2px solid #dfe6e9;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }
    .select-tel { 
      border-color: #0984e3; 
      color: #0984e3;
      flex-grow: 1; /* Ocupa el espacio disponible */
    }
    
    /* Estilos del botón copiar */
    .btn-copiar {
      background: #f1f2f6;
      border: 1px solid #dfe6e9;
      border-radius: 6px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-copiar:hover {
      background: #dfe6e9;
      transform: scale(1.05);
    }
    .btn-copiar:active {
      background: #b2bec3;
    }

    .btn-guardar {
      background: #00b894;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      transition: background 0.3s;
      margin-top: 8px;
    }
    .btn-guardar:hover { background: #00a884; }
    .btn-guardar:disabled { background: #b2bec3; cursor: not-allowed; }
    .loader { text-align: center; padding: 20px; font-weight: 600; color: #b2bec3; }
    
    .btn-secreto {
      position: fixed;
      bottom: 10px;
      right: 15px;
      font-size: 16px;
      opacity: 0.1;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.3s;
    }
    .btn-secreto:hover { opacity: 0.5; }
  </style>
</head>
<body>

  <a href="admin.html" class="btn-secreto" title="Acceso Admin">⚙️</a>

  <div class="contenedor">
    <h1>Gestión de Cartera - Asesores</h1>
    
    <div class="controles">
      <select id="filtro-asesor" class="input-box" onchange="filtrarTabla()">
        <option value="TODOS">👥 Todos los Asesores</option>
      </select>
    </div>

    <div id="cargando" class="loader">Cargando base de datos...</div>
    
    <table id="tabla-datos" style="display:none;">
      <thead>
        <tr>
          <th>Asesor</th>
          <th>DNI Cliente</th>
          <th>Número al que se llamó</th>
          <th>Tipificación</th>
        </tr>
      </thead>
      <tbody id="cuerpo-tabla"></tbody>
    </table>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzSQ0fVpmvhAOoXHFagOYQOr8mmJda2rhWHjvzumDbatJ1UHavifEF2dY4Oa2dU_2gG/exec";

    fetch(WEB_APP_URL)
      .then(response => response.json())
      .then(datos => mostrarDatos(datos))
      .catch(error => console.error("Error cargando base:", error));

    function mostrarDatos(datos) {
      document.getElementById('cargando').style.display = 'none';
      document.getElementById('tabla-datos').style.display = 'table';
      
      const cuerpo = document.getElementById('cuerpo-tabla');
      const selectAsesor = document.getElementById('filtro-asesor');
      cuerpo.innerHTML = '';
      
      const asesoresUnicos = [...new Set(datos.map(item => item.asesor.trim()).filter(a => a !== ''))].sort();
      selectAsesor.innerHTML = '<option value="TODOS">👥 Todos los Asesores</option>';
      
      asesoresUnicos.forEach(asesor => {
        const option = document.createElement('option');
        option.value = asesor;
        option.textContent = asesor;
        selectAsesor.appendChild(option);
      });
      
      datos.forEach(cliente => {
        const tr = document.createElement('tr');
        
        const telefonosList = [cliente.t1, cliente.t2, cliente.t3, cliente.t4, cliente.t5].filter(t => t.trim() !== '');
        let opcionesTelefonos = `<option value="" disabled ${!cliente.telefonoLlamado ? 'selected' : ''}>Seleccione teléfono...</option>`;
        
        telefonosList.forEach(tel => {
          opcionesTelefonos += `<option value="${tel}" ${cliente.telefonoLlamado === tel ? 'selected' : ''}>📞 ${tel}</option>`;
        });

        tr.innerHTML = `
          <td class="col-asesor">${cliente.asesor}</td>
          <td>${cliente.dni}</td>
          <td>
            <div class="caja-telefono">
              <select id="tel-${cliente.fila}" class="select-tel">
                ${opcionesTelefonos}
              </select>
              <button class="btn-copiar" onclick="copiarNumero(${cliente.fila})" title="Copiar número seleccionado">📋</button>
            </div>
          </td>
          <td>
            <select id="estado-${cliente.fila}">
              <option value="" disabled ${!cliente.estado ? 'selected' : ''}>Tipificación...</option>
              <option value="SE CONTACTO" ${cliente.estado === 'SE CONTACTO' ? 'selected' : ''}>SE CONTACTO</option>
              <option value="SE MANDO MENSAJE DE WSP Y SE AGENDO" ${cliente.estado === 'SE MANDO MENSAJE DE WSP Y SE AGENDO' ? 'selected' : ''}>SE MANDO MENSAJE DE WSP Y SE AGENDO</option>
              <option value="NO HAY CONTACTO" ${cliente.estado === 'NO HAY CONTACTO' ? 'selected' : ''}>NO HAY CONTACTO</option>
              <option value="TERCERO EQUIVOCADO" ${cliente.estado === 'TERCERO EQUIVOCADO' ? 'selected' : ''}>TERCERO EQUIVOCADO</option>
            </select>
            <button class="btn-guardar" onclick="guardarFila(event, ${cliente.fila})">💾 Guardar</button>
          </td>
        `;
        cuerpo.appendChild(tr);
      });
    }

    // Función para copiar el número al portapapeles
    function copiarNumero(fila) {
      const selectTel = document.getElementById(`tel-${fila}`);
      const numero = selectTel.value;
      
      if (!numero) {
        alert("⚠️ Seleccione un número primero para poder copiarlo.");
        return;
      }

      navigator.clipboard.writeText(numero).then(() => {
        // Pequeño feedback visual (cambia a un check verde)
        const btn = event.currentTarget;
        const contenidoOriginal = btn.innerHTML;
        btn.innerHTML = "✅";
        setTimeout(() => {
          btn.innerHTML = contenidoOriginal;
        }, 1500);
      }).catch(err => {
        console.error('Error al copiar: ', err);
        alert("No se pudo copiar el número.");
      });
    }

    function guardarFila(event, fila) {
      const btn = event.target;
      const selectTel = document.getElementById(`tel-${fila}`);
      const selectEstado = document.getElementById(`estado-${fila}`);
      
      if (!selectTel.value) {
        alert("⚠️ Por favor, seleccione primero el número al que llamó.");
        return;
      }
      if (!selectEstado.value) {
        alert("⚠️ Por favor, seleccione una tipificación.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Guardando...";
      selectTel.disabled = true;
      selectEstado.disabled = true;
      
      const estadoCodificado = encodeURIComponent(selectEstado.value);
      const telCodificado = encodeURIComponent(selectTel.value);
      const urlUpdate = `${WEB_APP_URL}?action=update&fila=${fila}&estado=${estadoCodificado}&telefonoLlamado=${telCodificado}`;

      fetch(urlUpdate)
        .then(() => {
          btn.innerText = "¡Guardado!";
          btn.style.background = "#6c5ce7";
          setTimeout(() => {
            btn.innerText = "💾 Guardar";
            btn.style.background = "#00b894";
            btn.disabled = false;
            selectTel.disabled = false;
            selectEstado.disabled = false;
          }, 2000);
        })
        .catch(() => { 
          alert("Error al guardar. Revise su conexión."); 
          btn.innerText = "💾 Guardar";
          btn.disabled = false; 
          selectTel.disabled = false; 
          selectEstado.disabled = false;
        });
    }

    function filtrarTabla() {
      const filtro = document.getElementById('filtro-asesor').value;
      const filas = document.querySelectorAll('#cuerpo-tabla tr');
      filas.forEach(fila => {
        const asesor = fila.querySelector('.col-asesor').textContent.trim();
        fila.style.display = (filtro === "TODOS" || asesor === filtro) ? '' : 'none';
      });
    }
  </script>
</body>
</html>
